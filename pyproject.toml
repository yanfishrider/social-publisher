[project]
name = "social-publisher"
version = "0.1.0"
description = "多平台社交媒体自动发布工具 — 支持小红书、搜狐号、百家号、今日头条等"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.54.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "pyperclip>=1.9.0",
    "fastapi>=0.139.0",
    "uvicorn>=0.49.0",
    "python-multipart>=0.0.32",
    "nest-asyncio>=1.6.0",
]

[dependency-groups]
dev = []
